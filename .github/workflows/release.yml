name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        rails: ["7.0", "7.1", "7.2", "8.0", "8.1"]
        exclude:
          # Rails 7.0 is only supported on Ruby 3.1 (7.0 predates Ruby 3.2+ support)
          - ruby: "3.2"
            rails: "7.0"
          - ruby: "3.3"
            rails: "7.0"
          - ruby: "3.4"
            rails: "7.0"
          - ruby: "4.0"
            rails: "7.0"
          # Rails 8.x requires Ruby 3.3+
          - ruby: "3.1"
            rails: "8.0"
          - ruby: "3.1"
            rails: "8.1"
          - ruby: "3.2"
            rails: "8.0"
          - ruby: "3.2"
            rails: "8.1"
          # Rails 7.x is not Ruby 4.0 compatible (no upstream support)
          - ruby: "4.0"
            rails: "7.1"
          - ruby: "4.0"
            rails: "7.2"

    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}

    env:
      RAILS_VERSION: ${{ matrix.rails }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # A publish must not depend on which order RSpec happened to pick. CI
      # runs a random seed to keep discovering order bugs; the release gate
      # runs fixed ones so the same commit always gets the same verdict.
      # 27377 is kept because it caught a real cross-example cache leak that a
      # random seed had waved through on the same commit.
      - name: Run specs (fixed seeds)
        run: |
          for seed in 1 27377 90210; do
            echo "::group::rspec --seed $seed"
            bundle exec rspec --seed "$seed" || exit 1
            echo "::endgroup::"
          done

      # Defined order is a fourth ordering no random seed reproduces: every
      # example runs in file order, so state leaking forward shows up here.
      - name: Run specs (defined order)
        run: bundle exec rspec --order defined

      - name: Run RuboCop
        run: bundle exec rubocop --parallel
        if: matrix.ruby == '3.3' && matrix.rails == '8.0'

  publish:
    needs: test
    runs-on: ubuntu-latest
    name: Publish to RubyGems + GitHub Release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify tag matches gem version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          GEM_VERSION=$(ruby -r ./lib/rails_ai_context/version -e "puts RailsAiContext::VERSION")
          if [ "$TAG_VERSION" != "$GEM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match gem version ($GEM_VERSION)"
            exit 1
          fi
          echo "Version verified: $GEM_VERSION"

      - name: Check if gem version already published
        id: check_gem
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if gem search rails-ai-context --exact --versions | grep -q "$VERSION"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Gem v$VERSION already on RubyGems - skipping push"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to RubyGems
        if: steps.check_gem.outputs.already_published == 'false'
        uses: rubygems/release-gem@v1

      - name: Build gem for release asset
        run: gem build rails-ai-context.gemspec

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          # Extract this version's changelog section
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}. See [CHANGELOG.md](CHANGELOG.md) for details."
          fi

          # Check if release already exists (e.g., re-tag or manually created)
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, updating"
            gh release edit "$TAG" --notes "$NOTES" --draft=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              *.gem
          fi

      - name: Upload mcpb to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Download mcpb from the initial release that created it
          gh release download v0.7.1 --pattern "rails-ai-context-mcp.mcpb" --dir .
          gh release upload "$TAG" rails-ai-context-mcp.mcpb --clobber

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    name: Publish to MCP Registry

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      # The committed manifest carries placeholders for the mcpb URL and its
      # digest, because neither is knowable until the release exists. This step
      # fills them in for publishing only; the edit lives in the runner's
      # checkout and is never committed back.
      - name: Fill in the manifest for publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="${GITHUB_REF#refs/tags/}"
          MCPB_URL="https://github.com/crisnahine/rails-ai-context/releases/download/${TAG}/rails-ai-context-mcp.mcpb"

          # Download mcpb from the release and compute its SHA256
          gh release download "$TAG" --pattern "rails-ai-context-mcp.mcpb" --dir /tmp
          SHA256=$(sha256sum /tmp/rails-ai-context-mcp.mcpb | awk '{print $1}')
          echo "Computed fileSha256: $SHA256"

          jq --arg v "$VERSION" --arg url "$MCPB_URL" --arg sha "$SHA256" \
            '.version = $v | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            server.json > server.tmp && mv server.tmp server.json
          echo "Publishing version $VERSION to MCP Registry"
          cat server.json

      - name: Publish to MCP Registry
        run: mcp-publisher publish

      # Only `version` goes back to main. The URL and digest stay placeholders
      # there, so nobody reads a stale artifact reference as current.
      - name: Record the released version in the manifest on main
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main
          # The publish step above rewrote server.json in this checkout, and
          # checkout -B carries that edit across. Take main's own copy back
          # before deciding whether main needs the bump, or the guard reads
          # the version it is about to write and always exits early.
          git checkout origin/main -- server.json

          if [ "$(jq -r .version server.json)" = "$VERSION" ]; then
            echo "server.json already records $VERSION"
            exit 0
          fi

          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          git add server.json
          git commit -m "chore: record v${VERSION} in the server manifest"

          # Plain push only. A rejection means someone else pushed, so rebase
          # this one commit onto the new tip and try again - never force.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push rejected, rebasing onto the new tip (attempt $attempt)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
