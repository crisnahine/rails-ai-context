name: Unit matrix

on:
  workflow_call:
    inputs:
      release_gate:
        description: >
          Run the stricter orderings a publish needs - fixed seeds and defined
          order - plus RuboCop, which otherwise only runs in CI's lint job.
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    # release.yml needs contents: write and id-token: write to publish. Without
    # this the legs inherit them, and a leg runs third-party gem code.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        rails: ["7.0", "7.1", "7.2", "8.0", "8.1"]
        exclude:
          # Rails 7.0 is only supported on Ruby 3.1 (7.0 predates Ruby 3.2+ support)
          - ruby: "3.2"
            rails: "7.0"
          - ruby: "3.3"
            rails: "7.0"
          - ruby: "3.4"
            rails: "7.0"
          - ruby: "4.0"
            rails: "7.0"
          # Rails 8.x requires Ruby 3.2+
          - ruby: "3.1"
            rails: "8.0"
          - ruby: "3.1"
            rails: "8.1"
          # Rails 7.x is not Ruby 4.0 compatible (no upstream support)
          - ruby: "4.0"
            rails: "7.1"
          - ruby: "4.0"
            rails: "7.2"

    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}

    env:
      RAILS_VERSION: ${{ matrix.rails }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # The search_code count examples skip without it, so the runner image
      # shipping it is stated here rather than assumed.
      - name: Ensure ripgrep
        run: command -v rg || sudo apt-get install -y ripgrep

      - name: Run specs
        if: ${{ !inputs.release_gate }}
        run: bundle exec rspec

      # A publish must not depend on which order RSpec happened to pick. CI
      # runs a random seed to keep discovering order bugs; the release gate
      # runs fixed ones so the same commit always gets the same verdict.
      # 27377 is kept because it caught a real cross-example cache leak that a
      # random seed had waved through on the same commit.
      - name: Run specs (fixed seeds)
        if: ${{ inputs.release_gate }}
        run: |
          for seed in 1 27377 90210; do
            echo "::group::rspec --seed $seed"
            bundle exec rspec --seed "$seed" || exit 1
            echo "::endgroup::"
          done

      # Defined order is a fourth ordering no random seed reproduces: every
      # example runs in file order, so state leaking forward shows up here.
      - name: Run specs (defined order)
        if: ${{ inputs.release_gate }}
        run: bundle exec rspec --order defined

      - name: Run RuboCop
        if: ${{ inputs.release_gate && matrix.ruby == '3.3' && matrix.rails == '8.0' }}
        run: bundle exec rubocop --parallel

  # The gem runs where its users work: macOS and Windows as well as Linux.
  # One leg each on the newest Ruby and Rails, and the oldest pairing on
  # macOS; the Linux matrix above covers the versions in between.
  os:
    runs-on: ${{ matrix.os }}
    # A spec that waits on a process the platform starts differently would
    # otherwise hold the runner for GitHub's six-hour default.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ruby: "3.4"
            rails: "8.1"
          - os: macos-latest
            ruby: "3.1"
            rails: "7.0"
          - os: windows-latest
            ruby: "3.4"
            rails: "8.1"

    name: ${{ matrix.os }} / Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}

    env:
      RAILS_VERSION: ${{ matrix.rails }}
      # An example that hangs fails by name (spec_helper.rb) instead of
      # stalling the job, and the documentation format shows where it was.
      RSPEC_EXAMPLE_TIMEOUT: "180"

    steps:
      # A Windows runner checks out with CRLF by default, which rewrites the
      # fixtures the specs compare byte for byte.
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Ensure ripgrep (macOS)
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep

      - name: Ensure ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress

      - name: Run specs
        if: ${{ !inputs.release_gate }}
        run: bundle exec rspec --format documentation

      - name: Run specs (fixed seed)
        if: ${{ inputs.release_gate }}
        run: bundle exec rspec --seed 27377 --format documentation
