name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, for the prism HEAD canary only.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/unit-matrix.yml

  # The gemspec's floors are claims; this is the test of them. Ruby 3.2 by
  # default (3.1 for the zeitwerk leg, which needs Rails 7.0), where prism is a
  # real gem rather than stdlib, so the pin actually decides which parser runs.
  # The trimmed gemfiles keep a dev dependency from resolving the pinned gem
  # upward and turning this into a test of whatever won.
  floor:
    # ubuntu-latest moved to 26.04, which has no prebuilt Ruby 3.1.
    runs-on: ${{ matrix.ruby == '3.1' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gem: prism
            version: "1.4.0"
          - gem: mcp
            version: "0.13.0"
          # railties 7.0 is the last line that allows zeitwerk 2.5, and it runs on Ruby 3.1 only.
          - gem: zeitwerk
            version: "2.5.0"
            rails: "7.0"
            ruby: "3.1"

    name: ${{ matrix.gem }} floor (${{ matrix.version }})

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gem }}_floor.gemfile
      RAILS_VERSION: ${{ matrix.rails || '8.0' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby || '3.2' }}
          bundler-cache: true

      - name: Confirm the pin took
        env:
          GEM_NAME: ${{ matrix.gem }}
          WANT: ${{ matrix.version }}
        run: |
          resolved=$(bundle exec ruby -e 'require ARGV[0]; print Gem.loaded_specs[ARGV[0]].version.to_s' "$GEM_NAME")
          echo "$GEM_NAME $resolved"
          test "$resolved" = "$WANT" || { echo "expected $GEM_NAME $WANT, got $resolved"; exit 1; }

      - name: Ensure ripgrep
        run: command -v rg || sudo apt-get install -y ripgrep

      - name: Run specs
        run: bundle exec rspec

  # The plugin ships from main to users whose gem may be the oldest release its
  # requirement accepts, so its scripts and rules run here against that release
  # from RubyGems.
  plugin-floor:
    runs-on: ubuntu-latest
    name: plugin gem floor

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # The plugin ships from main, so its requirement may name only a
      # published release (docs/RELEASING.md items 6 and 12).
      - name: Install the oldest release the plugin accepts
        id: floor
        run: |
          floor=$(ruby -r ./plugins/rails-ai-context/scripts/gem_requirement -e '
            print Gem::Requirement.new(*RailsAiContextPlugin::GEM_REQUIREMENT).requirements.find { |op, _| %w[>= ~> =].include?(op) }.last')
          latest=$(gem list --remote --exact rails-ai-context | sed -n 's/^rails-ai-context (\([^)]*\))$/\1/p')
          if [ -z "$latest" ]; then
            echo "::error::could not read the latest rails-ai-context from RubyGems"
            exit 1
          fi
          if ! gem install rails-ai-context -v "$floor" --install-dir "$RUNNER_TEMP/plugin-floor" --no-document; then
            echo "::error::could not install rails-ai-context $floor (above); where RubyGems lacks it, raise the requirement only after the publish (docs/RELEASING.md item 6)"
            exit 1
          fi
          # A release whose doctor and update notice know the plugin ships this file.
          aware=lib/rails_ai_context/claude_code_settings.rb
          if [ "$latest" != "$floor" ] && [ ! -f "$RUNNER_TEMP/plugin-floor/gems/rails-ai-context-$floor/$aware" ]; then
            gem install rails-ai-context -v "$latest" --install-dir "$RUNNER_TEMP/plugin-latest" --ignore-dependencies --no-document > /dev/null
            if [ -f "$RUNNER_TEMP/plugin-latest/gems/rails-ai-context-$latest/$aware" ]; then
              echo "::error::rails-ai-context $latest knows the plugin, and the plugin still accepts $floor, which does not: raise its requirement (docs/RELEASING.md item 12)"
              exit 1
            fi
          fi
          echo "gem_home=$RUNNER_TEMP/plugin-floor" >> "$GITHUB_OUTPUT"

      - name: Run the plugin's specs against it
        env:
          PLUGIN_FLOOR_GEM_HOME: ${{ steps.floor.outputs.gem_home }}
        run: bundle exec rspec spec/claude_plugin_spec.rb

  # Allowed to fail: it exists so a removal in prism's main branch surfaces
  # here rather than in a user's bundle after the next release.
  prism-head:
    runs-on: ubuntu-latest
    name: prism HEAD (canary)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    env:
      BUNDLE_GEMFILE: gemfiles/prism_head.gemfile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Bundle against prism main
        run: bundle install --jobs 4

      - name: Report the version under test
        run: bundle exec ruby -rprism -e 'puts "prism " + Prism::VERSION'

      - name: Ensure ripgrep
        run: command -v rg || sudo apt-get install -y ripgrep

      - name: Run specs
        run: bundle exec rspec

  # Each family and rails_query end to end on real database servers: only a server shows
  # how it reports a timeout and what its read-only transaction lets through.
  database_servers:
    # ubuntu-latest moved to 26.04, which has no prebuilt Ruby 3.1.
    runs-on: ${{ matrix.ruby == '3.1' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: "8.0"
            mariadb: "10.6"
          - mysql: "8.4"
            mariadb: "11.4"
          # Rails 7.0 runs on Ruby 3.1 only and has no Trilogy adapter.
          - mysql: "8.0"
            mariadb: "10.6"
            rails: "7.0"
            ruby: "3.1"
          - mysql: "8.4"
            mariadb: "11.4"
            rails: "8.1"

    name: Database servers - Rails ${{ matrix.rails || '8.0' }} / MySQL ${{ matrix.mysql }} / MariaDB ${{ matrix.mariadb }} / PostgreSQL 16

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: rac
          MYSQL_DATABASE: rac
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: rac
          MARIADB_DATABASE: rac
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BUNDLE_GEMFILE: gemfiles/database_servers.gemfile
      RAILS_VERSION: ${{ matrix.rails || '8.0' }}
      # MariaDB's client library signs in to MySQL and to MariaDB. The MySQL client from 9.0 on
      # cannot sign in to MariaDB, so mysql2 is not built against whichever client the image ships.
      BUNDLE_BUILD__MYSQL2: --with-mysql-config=/usr/bin/mariadb_config

    steps:
      - uses: actions/checkout@v7

      - name: Install the client library mysql2 builds against
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby || '3.4' }}
          bundler-cache: true

      - name: PostgreSQL
        env:
          RAC_TEST_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/rac
        run: bundle exec rspec spec/lib/rails_ai_context/database_family/database_servers_spec.rb spec/lib/rails_ai_context/tools/query_postgresql_spec.rb

      - name: MySQL (mysql2)
        env:
          RAC_TEST_MYSQL_URL: mysql2://root:rac@127.0.0.1:3306/rac
        run: bundle exec rspec spec/lib/rails_ai_context/database_family/database_servers_spec.rb spec/lib/rails_ai_context/tools/query_mysql_spec.rb spec/lib/rails_ai_context/app_databases_servers_spec.rb

      - name: MySQL (Trilogy)
        if: matrix.rails != '7.0'
        env:
          RAC_TEST_MYSQL_URL: trilogy://root:rac@127.0.0.1:3306/rac
        run: bundle exec rspec spec/lib/rails_ai_context/database_family/database_servers_spec.rb spec/lib/rails_ai_context/tools/query_mysql_spec.rb spec/lib/rails_ai_context/app_databases_servers_spec.rb

      - name: MariaDB (mysql2)
        env:
          RAC_TEST_MARIADB_URL: mysql2://root:rac@127.0.0.1:3307/rac
        run: bundle exec rspec spec/lib/rails_ai_context/database_family/database_servers_spec.rb spec/lib/rails_ai_context/tools/query_mysql_spec.rb spec/lib/rails_ai_context/app_databases_servers_spec.rb

      - name: MariaDB (Trilogy)
        if: matrix.rails != '7.0'
        env:
          RAC_TEST_MARIADB_URL: trilogy://root:rac@127.0.0.1:3307/rac
        run: bundle exec rspec spec/lib/rails_ai_context/database_family/database_servers_spec.rb spec/lib/rails_ai_context/tools/query_mysql_spec.rb spec/lib/rails_ai_context/app_databases_servers_spec.rb

  # The plan checks read the plan PostgreSQL prints, and its shape changes between major versions.
  postgresql_versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["13", "14", "15", "17", "18"]

    name: PostgreSQL ${{ matrix.postgresql }}

    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BUNDLE_GEMFILE: gemfiles/database_servers.gemfile
      BUNDLE_BUILD__MYSQL2: --with-mysql-config=/usr/bin/mariadb_config

    steps:
      - uses: actions/checkout@v7

      - name: Install the client library mysql2 builds against
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: PostgreSQL
        env:
          RAC_TEST_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/rac
        run: bundle exec rspec spec/lib/rails_ai_context/database_family/database_servers_spec.rb spec/lib/rails_ai_context/tools/query_postgresql_spec.rb

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --parallel
