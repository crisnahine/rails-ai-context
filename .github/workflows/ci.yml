name: CI

on:
  push:
    branches: [main, fix/issues-424-429-app-root-and-workspace-init]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, for the prism HEAD canary only.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/unit-matrix.yml

  # The gemspec's floors are claims; this is the test of them. Ruby 3.2 by
  # default (3.1 for the zeitwerk leg, which needs Rails 7.0), where prism is a
  # real gem rather than stdlib, so the pin actually decides which parser runs.
  # The trimmed gemfiles keep a dev dependency from resolving the pinned gem
  # upward and turning this into a test of whatever won.
  floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gem: prism
            version: "1.4.0"
          - gem: mcp
            version: "0.13.0"
          # railties 7.0 is the last line that allows zeitwerk 2.5, and it runs on Ruby 3.1 only.
          - gem: zeitwerk
            version: "2.5.0"
            rails: "7.0"
            ruby: "3.1"

    name: ${{ matrix.gem }} floor (${{ matrix.version }})

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gem }}_floor.gemfile
      RAILS_VERSION: ${{ matrix.rails || '8.0' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby || '3.2' }}
          bundler-cache: true

      - name: Confirm the pin took
        env:
          GEM_NAME: ${{ matrix.gem }}
          WANT: ${{ matrix.version }}
        run: |
          resolved=$(bundle exec ruby -e 'require ARGV[0]; print Gem.loaded_specs[ARGV[0]].version.to_s' "$GEM_NAME")
          echo "$GEM_NAME $resolved"
          test "$resolved" = "$WANT" || { echo "expected $GEM_NAME $WANT, got $resolved"; exit 1; }

      - name: Ensure ripgrep
        run: command -v rg || sudo apt-get install -y ripgrep

      - name: Run specs
        run: bundle exec rspec

  # Allowed to fail: it exists so a removal in prism's main branch surfaces
  # here rather than in a user's bundle after the next release.
  prism-head:
    runs-on: ubuntu-latest
    name: prism HEAD (canary)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    env:
      BUNDLE_GEMFILE: gemfiles/prism_head.gemfile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Bundle against prism main
        run: bundle install --jobs 4

      - name: Report the version under test
        run: bundle exec ruby -rprism -e 'puts "prism " + Prism::VERSION'

      - name: Ensure ripgrep
        run: command -v rg || sudo apt-get install -y ripgrep

      - name: Run specs
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --parallel
